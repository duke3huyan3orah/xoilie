name: Bug report
description: Report reproducible incorrect XOILIE behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private media, or other credentials.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the exact error text after removing sensitive values?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe command sequence or repository link.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: XOILIE revision or version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and operating system
      placeholder: Node 22.0.0, Windows 11
    validations:
      required: true
